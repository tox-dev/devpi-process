[build-system]
build-backend = "hatchling.build"
requires = [
  "hatch-fancy-pypi-readme>=25.1",
  "hatch-vcs>=0.5",
  "hatchling>=1.32.4",
  "python-sbom[hatch]>=0.1.2",
]

[project]
name = "devpi-process"
import-names = [ "devpi_process" ]
description = "devpi process provides a programmatic API to create and use a devpi server process"
keywords = [
  "devpi",
  "process",
  "testing",
]
license = "MIT"
maintainers = [
  { name = "Bernát Gábor", email = "gaborjbernat@gmail.com" },
]
authors = [
  { name = "Bernát Gábor", email = "gaborjbernat@gmail.com" },
]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Testing",
  "Topic :: Utilities",
]
dynamic = [
  "readme",
  "version",
]
dependencies = [
  "devpi-client>=7.3",
  "devpi-server>=6.20.3",
]
urls.Changelog = "https://github.com/tox-dev/devpi-process/blob/main/CHANGELOG.md"
urls.Homepage = "https://github.com/tox-dev/devpi-process#readme"
urls.Source = "https://github.com/tox-dev/devpi-process"
urls.Tracker = "https://github.com/tox-dev/devpi-process/issues"

[dependency-groups]
dev = [
  { include-group = "lint" },
  { include-group = "pkg-meta" },
  { include-group = "test" },
  { include-group = "type" },
]
test = [
  "covdefaults>=2.3",
  "httpx>=0.28.1",
  "pytest>=9.1.1",
  "pytest-cov>=7.1",
]
type = [
  "ty>=0.0.84",
  { include-group = "test" },
]
build = [
  "cython>=3",
  "hatch-fancy-pypi-readme>=25.1",
  "hatch-vcs>=0.5",
  "hatchling>=1.32.4",
  "python-sbom[hatch]>=0.1.2",
  "setuptools>=80",
]
lint = [
  "pre-commit-uv>=4.3",
]
pkg-meta = [
  "check-wheel-contents>=0.6.3",
  "twine>=7",
  "uv>=0.12.22",
]
release-news = [
  "release-creator>=4.4",
  "towncrier>=26.9",
]
release-notes = [
  "release-creator>=4.4",
]
release-prepare = [
  "prek>=0.5",
  "release-creator>=4.4",
  "towncrier>=26.9",
]

[tool.hatch]
version.source = "vcs"
metadata.hooks.fancy-pypi-readme.content-type = "text/markdown"
metadata.hooks.fancy-pypi-readme.fragments = [ { path = "README.md" } ]
metadata.hooks.fancy-pypi-readme.substitutions = [
  { pattern = '''(?x)
    (?<!!)\[(?P<label>[^\]]+)\]\( # Link text, excluding images
    (?P<path>CHANGELOG\.md|CONTRIBUTING\.md) # Repository files linked from the README
    \)
    ''', replacement = '[\g<label>](https://github.com/tox-dev/devpi-process/blob/main/\g<path>)' },
]
build.hooks.vcs.version-file = "src/devpi_process/_version.py"
build.hooks.python-sbom = {}

[tool.uv]
dependency-groups.release-news = { requires-python = ">=3.15" }
dependency-groups.release-notes = { requires-python = ">=3.15" }
dependency-groups.release-prepare = { requires-python = ">=3.15" }

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120
format.preview = true
format.docstring-code-line-length = 100
format.docstring-code-format = true
lint.select = [
  "ALL",
]
lint.ignore = [
  "CPY",                                       # No copyright statements
  "DOC",                                       # not supported
  "incorrect-blank-line-before-class",         # Conflicts with `blank-line-before-class`
  "missing-trailing-comma",                    # Conflict with formatter
  "multi-line-summary-first-line",             # Conflicts with `multi-line-summary-second-line`
  "single-line-implicit-string-concatenation", # Conflict with formatter
  "undocumented-magic-method",                 # function-docstring (simplint) owns internal docstrings
  "undocumented-public-class",                 # undocumented-public-api (simplint) owns the public API
  "undocumented-public-function",              # undocumented-public-api (simplint) owns the public API
  "undocumented-public-init",                  # undocumented-public-api (simplint) owns the public API
  "undocumented-public-method",                # undocumented-public-api (simplint) owns the public API
  "undocumented-public-nested-class",          # undocumented-public-api (simplint) owns the public API
  "unnecessary-regular-expression-compile",    # conflicts with simplint inline-regex
]
lint.per-file-ignores."tests/**/*.py" = [
  "assert",                     # asserts allowed in tests
  "D",                          # test names carry the intent
  "implicit-namespace-package", # test directories are not packages
]
lint.isort = { known-first-party = [
  "devpi_process",
], required-imports = [
  "from __future__ import annotations",
] }
lint.preview = true

[tool.codespell]
builtin = "clear,usage,en-GB_to_en-US"
write-changes = true
count = true

[tool.pyproject-fmt]
max_supported_python = "3.15"

[tool.ty]
environment.python-version = "3.15"

[tool.coverage]
run.parallel = true
run.plugins = [
  "covdefaults",
]
paths.source = [
  "src",
  ".tox*/*/lib/python*/site-packages",
  ".tox*/pypy*/site-packages",
  ".tox*\\*\\Lib\\site-packages",
  "*/src",
  "*\\src",
]
report.fail_under = 98
report.omit = []
html.show_contexts = true
html.skip_covered = false

[tool.towncrier]
name = "devpi-process"
directory = "changelog.d"
filename = "CHANGELOG.md"
template = "release_creator.fragments:template.jinja2"
title_format = false
type = [
  { directory = "feature", name = "Added", showcontent = true },
  { directory = "change", name = "Changes", showcontent = true },
  { directory = "bugfix", name = "Fixed", showcontent = true },
  { directory = "doc", name = "Documentation", showcontent = true },
  { directory = "breaking", name = "Breaking changes", showcontent = true },
  { directory = "security", name = "Security", showcontent = true },
  { directory = "performance", name = "Performance", showcontent = true },
  { directory = "deprecation", name = "Deprecated", showcontent = true },
  { directory = "removal", name = "Removed", showcontent = true },
  { directory = "packaging", name = "Packaging", showcontent = true },
]

[tool.python-sbom]
supplier = { name = "tox-dev", url = [ "https://github.com/tox-dev" ] }

[tool.nab]
mode = "universal"
base-group = "project-runtime"
default-groups = []
uploaded-prior-to = "P7D"
decision-order = "stable"
matrix.python = ">=3.15,<3.16"
matrix.platforms = [ "linux_x86_64" ]
# release-creator 4.4.0 needs a seven-day cutoff exception.
# expires 2026-11-16
packages.release-creator.uploaded-prior-to = 2026-11-02T21:45:00Z
# python-sbom 0.1.2 needs a seven-day cutoff exception.
# expires 2026-11-15
packages.python-sbom.uploaded-prior-to = 2026-11-08T17:54:00Z

[tool.simplint]
docstring-style = "rst"
