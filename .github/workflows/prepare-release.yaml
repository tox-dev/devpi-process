name: Prepare release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        options:
          - auto
          - major
          - minor
          - patch
        default: auto
permissions:
  contents: read
  pull-requests: read
jobs:
  prepare:
    name: Prepare Towncrier release
    uses: tox-dev/github-workflows/.github/workflows/prepare-towncrier-release.yaml@24e7c78489b6e2adb7b8f881761a5c2dbfe03fee
    with:
      bump: ${{ inputs.bump }}
      changelog: CHANGELOG.md
      fragments: changelog.d
      format: markdown
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
