name: Prepare release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        options:
          - auto
          - major
          - minor
          - patch
        default: auto
permissions:
  contents: read
  pull-requests: read
jobs:
  prepare:
    name: Prepare Towncrier release
    uses: tox-dev/github-workflows/.github/workflows/prepare-towncrier-release.yaml@e2d5e308194a31710039f3237b7157431c0e38b5 # v2.0.0
    with:
      bump: ${{ inputs.bump }}
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
