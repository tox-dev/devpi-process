name: Label maintenance PRs
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] This workflow reads PR metadata without checkout or PR code.
    types: [opened, reopened, synchronize]
permissions: {}
concurrency:
  group: label-maintenance-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  label:
    name: Label bot PRs
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      issues: write # Apply or remove the skip news label.
      pull-requests: read
    steps:
      - uses: tox-dev/github-workflows/label-bot-news@5e11f2254a4dcb7102747d312ad7db48a2e9b0cb
